# Ensure that unauthenticated requests are refused with a 401.
# This pod definition should match its siblings, except for the name, serviceAccount and command.
apiVersion: v1
kind: Pod
metadata:
  name: operator-metrics-no-auth
  labels:
    test: metrics-access
spec:
  restartPolicy: Never
  containers:
  - name: run
    # PREFETCH-THIS-IMAGE <-- a CI script looks for this marker
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest@sha256:5b74fce9d6e629942a0c6dc0f546c193e70d7f974d999a48c948c53dd3d36362
    args:
    - bash
    - "-c"
    - >-
        url="https://rhacs-operator-controller-manager-metrics-service.{{ .Vars.operator_ns }}.svc.cluster.local:8443/metrics";
        set -u;
        curl --version;
        for attempt in $(seq 5); do
          echo Attempt $attempt:;
          curl --insecure --dump-header /tmp/headers "$url";
          echo response:;
          head -n 1 /tmp/headers;
          echo checking response headers:;
          if grep -Ei "^HTTP/[0-9.]+ 401" /tmp/headers; then exit 0; fi;
          sleep 1;
        done;
        exit 1
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  serviceAccount: operator-metrics-unprivileged
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
