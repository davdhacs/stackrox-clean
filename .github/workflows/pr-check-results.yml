name: PR checks summary
on:
  pull_request:
jobs:
  hide-konflux-checks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: GitHub Checks
        uses: poseidon/wait-for-status-checks@v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delay: 20m
          interval: 5m
          ignore_pattern: konflux
