name: Cache Go Dependencies
description: Cache Go Dependencies
inputs:
  save:
    description: 'Whether this job is eligible to save caches. Actual saving only happens on pushes to save_on_ref.'
    required: false
    type: boolean
    default: false
  save_on_ref:
    description: 'Git ref that triggers cache saving on push events (default master).'
    required: false
    default: refs/heads/master
  cache_group:
    description: 'GOCACHE group name. Defaults to pre-build-go-binaries (shared). Set to job name for per-job isolation.'
    required: false
    default: 'pre-build-go-binaries'
runs:
  using: composite
  steps:
    - name: Determine Go cache paths
      id: vars
      run: |
        echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "GOARCH=$(go env GOARCH)" >> "$GITHUB_OUTPUT"
        # TODO(davdhacs): restore save_on_ref guard after validating warm cache on PR
        #if [[ "${{ inputs.save }}" == "true" && "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "${{ inputs.save_on_ref }}" ]]; then
        if [[ "${{ inputs.save }}" == "true" ]]; then
          echo "save=1" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Cache Go Dependencies
      if: steps.vars.outputs.save
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.vars.outputs.GOMODCACHE }}
        key: go-mod-v2-${{ hashFiles('**/go.sum') }}
        restore-keys: go-mod-v2-

    - name: Restore Go Dependencies
      if: ! steps.vars.outputs.save
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.vars.outputs.GOMODCACHE }}
        key: go-mod-v2-${{ hashFiles('**/go.sum') }}
        restore-keys: go-mod-v2-

    - name: Cache Go Build
      if: steps.vars.outputs.save
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.vars.outputs.GOCACHE }}
        key: go-build-v2-${{ inputs.cache_group }}-${{ steps.vars.outputs.GOARCH }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-build-v2-${{ inputs.cache_group }}-${{ steps.vars.outputs.GOARCH }}-

    - name: Restore Go Build
      if: ! steps.vars.outputs.save
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.vars.outputs.GOCACHE }}
        key: go-build-v2-${{ inputs.cache_group }}-${{ steps.vars.outputs.GOARCH }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-build-v2-${{ inputs.cache_group }}-${{ steps.vars.outputs.GOARCH }}-

    - name: Download Go modules
      run: make deps --always-make
      shell: bash
