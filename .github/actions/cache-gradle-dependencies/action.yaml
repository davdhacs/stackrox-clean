name: Cache QA Tests Dependencies
description: Cache QA Tests Dependencies
runs:
  using: composite
  steps:
    - name: Cache Gradle Dependencies
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # ratchet:actions/cache@v6.0.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.m2/repository
        key: gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          gradle-v2-
