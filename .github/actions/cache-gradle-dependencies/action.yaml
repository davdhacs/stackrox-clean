name: Cache QA Tests Dependencies
description: Cache QA Tests Dependencies
runs:
  using: composite
  steps:
    - name: Cache Gradle Dependencies (save)
      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.m2/repository
        key: gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-v2-

    - name: Cache Gradle Dependencies (restore)
      if: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.m2/repository
        key: gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-v2-
