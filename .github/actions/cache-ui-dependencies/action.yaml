name: Cache UI Dependencies
description: Cache UI Dependencies
inputs:
  lockFile:
    description: Where the package lock is written
    required: true
    default: "ui/apps/platform/package-lock.json"
runs:
  using: composite
  steps:
    - name: Cache UI Dependencies (save)
      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache@v5
      with:
        path: |
          /github/home/.npm
          /github/home/.cache/Cypress
          /usr/local/share/.cache
        key: npm-v2-${{ hashFiles(inputs.lockFile) }}
        restore-keys: npm-v2-

    - name: Cache UI Dependencies (restore)
      if: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
      uses: actions/cache/restore@v5
      with:
        path: |
          /github/home/.npm
          /github/home/.cache/Cypress
          /usr/local/share/.cache
        key: npm-v2-${{ hashFiles(inputs.lockFile) }}
        restore-keys: npm-v2-
